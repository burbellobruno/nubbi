name: Temporary Nubbi Docker validation

on:
  push:
    branches: [validation/nubbi-docker-20261025]

permissions:
  contents: read

concurrency:
  group: nubbi-docker-validation-20261025
  cancel-in-progress: true

jobs:
  docker-smoke:
    if: github.repository == 'burbellobruno/nubbi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact validated candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 0a190c19b106ff89a46989062dbd82b57ee9ea77
          persist-credentials: false
          fetch-depth: 1
      - name: Verify tree and build clean Git export
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0a190c19b106ff89a46989062dbd82b57ee9ea77
          test "$(git rev-parse 'HEAD^{tree}')" = 9d3c212d6617c837450fc9c3b9b8287b0b7959e3
          mkdir "$RUNNER_TEMP/nubbi-context"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/nubbi-context"
          test ! -e "$RUNNER_TEMP/nubbi-context/.env"
          test ! -e "$RUNNER_TEMP/nubbi-context/public/ai-client.js.bak-R1"
          docker build --pull --progress=plain -t nubbi-validation "$RUNNER_TEMP/nubbi-context"
          docker image inspect nubbi-validation --format 'Built image: {{.Id}}'
      - name: Start isolated container and verify HTTP bytes
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name nubbi-validation --network none --memory 256m --cpus 1 --pids-limit 128 nubbi-validation
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec nubbi-validation node -e 'fetch("http://127.0.0.1:3001/",{signal:AbortSignal.timeout(2000)}).then(r=>{if(r.status!==200)process.exit(1)}).catch(()=>process.exit(1))'; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true || { echo "Container did not become ready"; exit 1; }
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process'),crypto=require('crypto');
          const paths=['/','/index.html','/style.css','/ui-v2.css','/experience.css','/ai-client.js','/app.js','/community.js','/ui-v2.js','/experience.js','/nubbi-intro.webm','/nubbi-intro-soft.wav','/catalog.js','/logo.png','/favicon.png','/icon-192.png','/icon-512.png','/manifest.webmanifest','/sw.js'];
          const expected=Object.fromEntries(paths.map(p=>[p,crypto.createHash('sha256').update(fs.readFileSync('public/'+(p==='/'?'index.html':p.slice(1)))).digest('hex')]));
          const script=`(async()=>{
            const assert=require('assert/strict'),crypto=require('crypto');
            const r=await fetch('http://127.0.0.1:3001/api/health',{signal:AbortSignal.timeout(5000)});assert.equal(r.status,200);
            const health=await r.json();assert.equal(health.ok,false);assert.equal(health.hasApiKey,false);assert.equal(health.adultHasApiKey,false);
            console.log('PASS /api/health: HTTP 200, providers intentionally unconfigured');
            for(const [p,hash] of Object.entries(${JSON.stringify(expected)})){
              const response=await fetch('http://127.0.0.1:3001'+p,{signal:AbortSignal.timeout(5000)});assert.equal(response.status,200,p);
              const body=Buffer.from(await response.arrayBuffer());assert.equal(crypto.createHash('sha256').update(body).digest('hex'),hash,p);
              console.log('PASS exact source bytes '+p);
            }
            for(const p of ['/.env','/ai-client.js.bak-R1']){const response=await fetch('http://127.0.0.1:3001'+p,{signal:AbortSignal.timeout(5000)});assert.equal(response.status,404,p);}
          })().catch(e=>{console.error(e);process.exit(1)});`;
          cp.execFileSync('docker',['exec','nubbi-validation','node','-e',script],{stdio:'inherit'});
          NODE
      - name: Preserve diagnostics in job log and clean up
        if: always()
        shell: bash
        run: |
          docker logs nubbi-validation 2>&1 || true
          docker inspect nubbi-validation --format 'Container state: {{json .State}}' || true
          docker rm -f nubbi-validation || true
