services:
  - type: web
    name: nubbi
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: CHAT_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: CHAT_API_KEY
        sync: false
      - key: CHAT_MODEL
        value: openai/gpt-oss-120b
      - key: CHAT_MODEL_ALLOWLIST
        value: openai/gpt-oss-20b,openai/gpt-oss-120b
